[project]
name = "retrieval"
version = "0.1.0"
description = "Retrieval service: chunking, embeddings, pgvector search, reranking"
authors = [
    { name = "Ashwin Jayan", email = "ashwin.apps00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
retrieval = "retrieval.app:main"
ingest = "retrieval.ingest:main"
ingest-claims = "retrieval.ingest_claims:main"
evaluate = "retrieval.evaluation:main"
migrate = "retrieval.store:migrate"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["db: needs the Postgres container running (skipped otherwise)"]
