[project]
name = "retrieval"
version = "0.1.0"
description = "Retrieval service: chunking, embeddings, pgvector search, reranking"
authors = [
    { name = "Ashwin Jayan", email = "ashwin.apps00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
retrieval = "retrieval.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
